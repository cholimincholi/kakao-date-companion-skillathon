<svg xmlns="http://www.w3.org/2000/svg" width="640" height="760" viewBox="0 0 640 760" role="img" aria-label="가상 카카오톡 대화 예시">
  <rect width="640" height="760" fill="#BFD3E6"/>
  <rect width="640" height="56" fill="#AFC8DD"/>
  <text x="28" y="36" font-size="19" font-weight="700" fill="#17212B">여자친구</text>
  <text x="566" y="36" font-size="14" fill="#334">mock</text>
  <text x="28" y="78" font-size="13" fill="#475866">가상 대화 예시 - 실제 개인정보 없음</text>
  <text x="28" y="82" font-size="12" fill="#65717a">여자친구</text><rect x="28" y="92" width="330" height="47" rx="18" fill="#FFFFFF" stroke="#D9E0E5"/><text x="44" y="122" font-size="16" fill="#202124">이번 주말에 시간 돼?</text><text x="318" y="155" font-size="12" fill="#65717a">나</text><rect x="318" y="165" width="254" height="47" rx="18" fill="#FEE500" stroke="#D9E0E5"/><text x="334" y="195" font-size="16" fill="#202124">토요일이면 괜찮아. 어디 갈까?</text><text x="28" y="228" font-size="12" fill="#65717a">여자친구</text><rect x="28" y="238" width="330" height="47" rx="18" fill="#FFFFFF" stroke="#D9E0E5"/><text x="44" y="268" font-size="16" fill="#202124">성수 오랜만에 가고 싶긴 해.</text><text x="28" y="301" font-size="12" fill="#65717a">여자친구</text><rect x="28" y="311" width="330" height="68" rx="18" fill="#FFFFFF" stroke="#D9E0E5"/><text x="44" y="341" font-size="16" fill="#202124">낮에는 일이 있어서 오후 5시 이후가 좋</text><text x="44" y="362" font-size="16" fill="#202124">아.</text><text x="28" y="395" font-size="12" fill="#65717a">여자친구</text><rect x="28" y="405" width="330" height="68" rx="18" fill="#FFFFFF" stroke="#D9E0E5"/><text x="44" y="435" font-size="16" fill="#202124">파스타 좋고, 너무 비싼 곳은 좀 부담돼</text><text x="44" y="456" font-size="16" fill="#202124">.</text><text x="28" y="489" font-size="12" fill="#65717a">여자친구</text><rect x="28" y="499" width="330" height="68" rx="18" fill="#FFFFFF" stroke="#D9E0E5"/><text x="44" y="529" font-size="16" fill="#202124">오래 걷는 건 싫고 역에서 가까운 데면 </text><text x="44" y="550" font-size="16" fill="#202124">좋겠다.</text><text x="28" y="583" font-size="12" fill="#65717a">여자친구</text><rect x="28" y="593" width="330" height="68" rx="18" fill="#FFFFFF" stroke="#D9E0E5"/><text x="44" y="623" font-size="16" fill="#202124">홍대는 너무 자주 갔고 사람 많아서 이번</text><text x="44" y="644" font-size="16" fill="#202124">엔 별로야.</text><text x="28" y="677" font-size="12" fill="#65717a">여자친구</text><rect x="28" y="687" width="330" height="68" rx="18" fill="#FFFFFF" stroke="#D9E0E5"/><text x="44" y="717" font-size="16" fill="#202124">한남은 아직 안 가봤는데 언젠가 가보고 </text><text x="44" y="738" font-size="16" fill="#202124">싶어.</text><text x="318" y="771" font-size="12" fill="#65717a">나</text><rect x="318" y="781" width="254" height="47" rx="18" fill="#FEE500" stroke="#D9E0E5"/><text x="334" y="811" font-size="16" fill="#202124">담주 성수 ㄱㄱ?</text><text x="318" y="844" font-size="12" fill="#65717a">나</text><rect x="318" y="854" width="254" height="68" rx="18" fill="#FEE500" stroke="#D9E0E5"/><text x="334" y="884" font-size="16" fill="#202124">너무 빡세게 말고 밥 먹고 카페 정도면 </text><text x="334" y="905" font-size="16" fill="#202124">좋을듯</text>
</svg>
